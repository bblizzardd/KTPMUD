openapi: 3.0.3
info:
  title: API Hệ thống hỗ trợ theo dõi điều trị ngoại trú ĐTĐ type 2
  version: 1.0.0-sprint1
  description: |
    Đặc tả giao diện lập trình phiên bản 1 cho hệ thống hỗ trợ người chăm sóc theo dõi
    điều trị ngoại trú bệnh nhân cao tuổi mắc đái tháo đường type 2 (Nhóm N01-01).

    Hai cơ chế xác thực:
    - `caregiverAuth`: JWT cấp cho người chăm sóc sau khi đăng nhập (Web App).
    - `deviceAuth`: token thiết bị cấp sau khi ghép nối bằng mã một lần (Mobile App,
      chế độ bệnh nhân hoặc người nhà). Phía bệnh nhân không đăng nhập bằng mật khẩu.

    Mọi lỗi trả về theo schema `Error`. Mọi thao tác ghi đều sinh bản ghi nhật ký (FR-18).
  contact:
    name: Nhóm N01-01, Kỹ thuật phần mềm ứng dụng, ĐHBK Hà Nội
servers:
  - url: http://localhost:8080/api/v1
    description: Máy chủ mock phục vụ Frontend lập trình song song
tags:
  - name: Auth
    description: Tài khoản người chăm sóc
  - name: Patients
    description: Hồ sơ bệnh nhân
  - name: Devices
    description: Ghép nối thiết bị bệnh nhân và người nhà
  - name: Delegates
    description: Ủy quyền người nhà
  - name: Drugs
    description: Danh mục thuốc chuẩn
  - name: Prescriptions
    description: Đơn thuốc
  - name: Doses
    description: Cữ thuốc và xác nhận
  - name: Adherence
    description: Tổng hợp tuân thủ và cảnh báo
  - name: Clinical
    description: Chỉ số xét nghiệm và lịch tái khám
  - name: Reports
    description: Báo cáo PDF
  - name: Audit
    description: Nhật ký thao tác

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Đăng ký tài khoản người chăm sóc
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Tạo tài khoản thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Caregiver' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Đăng nhập người chăm sóc
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Làm mới access token
      operationId: refreshToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string }
      responses:
        '200':
          description: Token mới
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /patients:
    get:
      tags: [Patients]
      summary: Danh sách bệnh nhân người chăm sóc đang theo dõi
      operationId: listPatients
      responses:
        '200':
          description: Danh sách hồ sơ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Patient' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Patients]
      summary: Tạo hồ sơ bệnh nhân
      operationId: createPatient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientCreate' }
      responses:
        '201':
          description: Tạo hồ sơ thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /patients/{patientId}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Patients]
      summary: Xem hồ sơ bệnh nhân
      operationId: getPatient
      responses:
        '200':
          description: Hồ sơ bệnh nhân
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Patients]
      summary: Cập nhật hồ sơ và mốc giờ nhắc mặc định
      operationId: updatePatient
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatientUpdate' }
      responses:
        '200':
          description: Hồ sơ sau cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Patient' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/pairing-codes:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    post:
      tags: [Devices]
      summary: Sinh mã ghép nối một lần cho thiết bị bệnh nhân hoặc người nhà
      operationId: createPairingCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role]
              properties:
                role: { $ref: '#/components/schemas/DeviceRole' }
                delegateId:
                  type: string
                  format: uuid
                  description: Bắt buộc khi role = DELEGATE
      responses:
        '201':
          description: Mã ghép nối, hiệu lực ngắn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PairingCode' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /devices/pair:
    post:
      tags: [Devices]
      summary: Thiết bị đổi mã ghép nối lấy token thiết bị
      operationId: pairDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DevicePairRequest' }
      responses:
        '200':
          description: Ghép nối thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceToken' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '410':
          description: Mã ghép nối đã hết hạn hoặc đã dùng
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /patients/{patientId}/delegates:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Delegates]
      summary: Danh sách người nhà được ủy quyền
      operationId: listDelegates
      responses:
        '200':
          description: Danh sách ủy quyền
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Delegate' }
    post:
      tags: [Delegates]
      summary: Ủy quyền người nhà xác nhận hộ
      operationId: createDelegate
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DelegateCreate' }
      responses:
        '201':
          description: Ủy quyền thành công
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegate' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /patients/{patientId}/delegates/{delegateId}:
    parameters:
      - $ref: '#/components/parameters/PatientId'
      - name: delegateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Delegates]
      summary: Thu hồi ủy quyền và vô hiệu token thiết bị liên quan
      operationId: revokeDelegate
      responses:
        '204': { description: Đã thu hồi }
        '404': { $ref: '#/components/responses/NotFound' }

  /drugs:
    get:
      tags: [Drugs]
      summary: Gợi ý tên thuốc từ danh mục chuẩn
      operationId: searchDrugs
      parameters:
        - name: q
          in: query
          required: true
          description: Chuỗi người dùng đang gõ, tối thiểu 2 ký tự
          schema: { type: string, minLength: 2 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 20, default: 10 }
      responses:
        '200':
          description: Danh sách gợi ý, sắp theo độ khớp
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Drug' }

  /patients/{patientId}/prescriptions:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Prescriptions]
      summary: Danh sách đơn thuốc của bệnh nhân
      operationId: listPrescriptions
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/PrescriptionStatus' }
      responses:
        '200':
          description: Danh sách đơn
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Prescription' }
    post:
      tags: [Prescriptions]
      summary: Tạo đơn thuốc ở trạng thái Nháp
      operationId: createPrescription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescriptionInput' }
      responses:
        '201':
          description: Đơn nháp đã tạo, chưa sinh cữ thuốc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prescription' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /prescriptions/{prescriptionId}:
    parameters:
      - $ref: '#/components/parameters/PrescriptionId'
    get:
      tags: [Prescriptions]
      summary: Xem chi tiết đơn thuốc
      operationId: getPrescription
      responses:
        '200':
          description: Chi tiết đơn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prescription' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Prescriptions]
      summary: Sửa đơn thuốc, chỉ cho phép khi đơn ở trạng thái Nháp
      operationId: updatePrescription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PrescriptionInput' }
      responses:
        '200':
          description: Đơn sau cập nhật
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prescription' }
        '409': { $ref: '#/components/responses/Conflict' }
  /prescriptions/{prescriptionId}/confirm:
    parameters:
      - $ref: '#/components/parameters/PrescriptionId'
    post:
      tags: [Prescriptions]
      summary: Xác nhận đơn, chuyển sang Hiệu lực và sinh lịch cữ thuốc
      description: |
        Đơn Hiệu lực trước đó của cùng bệnh nhân chuyển sang Bị thay thế; các cữ thuốc
        tương lai của đơn cũ chuyển sang Đã hủy (FR-04). Việc sinh cữ chạy bất đồng bộ.
      operationId: confirmPrescription
      responses:
        '202':
          description: Đã xác nhận, đang sinh lịch cữ thuốc
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prescription' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /prescriptions/{prescriptionId}/cancel:
    parameters:
      - $ref: '#/components/parameters/PrescriptionId'
    post:
      tags: [Prescriptions]
      summary: Hủy đơn nháp
      operationId: cancelPrescription
      responses:
        '200':
          description: Đơn đã hủy
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Prescription' }
        '409': { $ref: '#/components/responses/Conflict' }

  /patients/{patientId}/doses:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Doses]
      summary: Tra cứu cữ thuốc theo khoảng ngày và trạng thái
      operationId: listDoses
      parameters:
        - { name: from, in: query, required: true, schema: { type: string, format: date } }
        - { name: to, in: query, required: true, schema: { type: string, format: date } }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/DoseStatus' }
      responses:
        '200':
          description: Danh sách cữ thuốc
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dose' }
  /device/doses/today:
    get:
      tags: [Doses]
      summary: Cữ thuốc hôm nay cho màn hình chế độ đơn giản
      operationId: listTodayDosesForDevice
      security:
        - deviceAuth: []
      responses:
        '200':
          description: Cữ thuốc trong ngày của bệnh nhân gắn với thiết bị
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Dose' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /doses/{doseId}/confirmations:
    parameters:
      - name: doseId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Doses]
      summary: Xác nhận đã uống thuốc bằng một chạm
      description: |
        Người thực hiện được suy ra từ token thiết bị: PATIENT cho ra trạng thái Đã uống,
        DELEGATE cho ra Đã uống (hộ). Xác nhận sau thời hạn cho ra Xác nhận muộn.
        Bản ghi xác nhận không sửa được; đính chính bằng bản ghi mới (FR-15).
      operationId: confirmDose
      security:
        - deviceAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmationCreate' }
      responses:
        '201':
          description: Đã ghi nhận xác nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Confirmation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }

  /patients/{patientId}/adherence/summary:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Adherence]
      summary: Tổng hợp tỷ lệ tuân thủ theo kỳ
      operationId: getAdherenceSummary
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30, 90], default: 30 }
      responses:
        '200':
          description: Số liệu tuân thủ
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdherenceSummary' }
  /patients/{patientId}/alerts:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Adherence]
      summary: Danh sách cảnh báo; bản thời gian thực đẩy qua WSS /ws/alerts
      operationId: listAlerts
      parameters:
        - name: unreadOnly
          in: query
          schema: { type: boolean, default: false }
      responses:
        '200':
          description: Danh sách cảnh báo
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Alert' }

  /patients/{patientId}/lab-results:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Clinical]
      summary: Lịch sử chỉ số xét nghiệm
      operationId: listLabResults
      responses:
        '200':
          description: Danh sách chỉ số
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LabResult' }
    post:
      tags: [Clinical]
      summary: Ghi nhận chỉ số xét nghiệm sau đợt khám
      operationId: createLabResult
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabResultCreate' }
      responses:
        '201':
          description: Đã ghi nhận
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LabResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /patients/{patientId}/appointments:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Clinical]
      summary: Danh sách lịch tái khám
      operationId: listAppointments
      responses:
        '200':
          description: Danh sách lịch hẹn
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Appointment' }
    post:
      tags: [Clinical]
      summary: Thêm lịch hẹn tái khám
      operationId: createAppointment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AppointmentCreate' }
      responses:
        '201':
          description: Đã thêm lịch hẹn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Appointment' }

  /patients/{patientId}/reports:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    post:
      tags: [Reports]
      summary: Yêu cầu dựng báo cáo PDF, xử lý bất đồng bộ
      operationId: requestReport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodDays]
              properties:
                periodDays: { type: integer, enum: [30, 60, 90], default: 30 }
      responses:
        '202':
          description: Đã nhận yêu cầu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
  /reports/{reportId}:
    get:
      tags: [Reports]
      summary: Trạng thái và đường dẫn tải báo cáo
      operationId: getReport
      parameters:
        - name: reportId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Thông tin báo cáo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportJob' }
        '404': { $ref: '#/components/responses/NotFound' }

  /patients/{patientId}/audit-logs:
    parameters:
      - $ref: '#/components/parameters/PatientId'
    get:
      tags: [Audit]
      summary: Tra cứu nhật ký thao tác trên hồ sơ
      operationId: listAuditLogs
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: size, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        '200':
          description: Trang nhật ký
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  page: { type: integer }
                  size: { type: integer }
                  total: { type: integer }

security:
  - caregiverAuth: []

components:
  securitySchemes:
    caregiverAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    deviceAuth:
      type: http
      scheme: bearer
      description: Token thiết bị cấp qua /devices/pair
  parameters:
    PatientId:
      name: patientId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PrescriptionId:
      name: prescriptionId
      in: path
      required: true
      schema: { type: string, format: uuid }
  responses:
    BadRequest:
      description: Dữ liệu đầu vào không hợp lệ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Thiếu hoặc sai token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: Không có quyền trên hồ sơ này
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Không tìm thấy tài nguyên
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Xung đột trạng thái
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unprocessable:
      description: Vi phạm luật nghiệp vụ
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string, example: DOSE_ALREADY_CONFIRMED }
        message: { type: string, example: Cữ thuốc này đã được xác nhận }
        details:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              issue: { type: string }
    RegisterRequest:
      type: object
      required: [email, password, displayName]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 8 }
        displayName: { type: string, maxLength: 100 }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    TokenPair:
      type: object
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        expiresIn: { type: integer, example: 900 }
    Caregiver:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        displayName: { type: string }
        createdAt: { type: string, format: date-time }
    PatientCreate:
      type: object
      required: [alias, birthYear]
      properties:
        alias:
          type: string
          maxLength: 50
          description: Tên gọi trong gia đình, không dùng họ tên thật (Zero PII)
          example: Bố
        birthYear: { type: integer, minimum: 1920, maximum: 2010 }
        reminderTimes:
          type: array
          description: Mốc giờ nhắc mặc định theo buổi
          items: { $ref: '#/components/schemas/ReminderTime' }
    PatientUpdate:
      type: object
      properties:
        alias: { type: string, maxLength: 50 }
        reminderTimes:
          type: array
          items: { $ref: '#/components/schemas/ReminderTime' }
        missedThresholdMinutes:
          type: integer
          minimum: 15
          maximum: 360
          description: Ngưỡng chuyển sang Bỏ lỡ, chờ kiểm chứng với bác sĩ
    Patient:
      allOf:
        - $ref: '#/components/schemas/PatientCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            missedThresholdMinutes: { type: integer, example: 120 }
            pairedDevice: { type: boolean }
            createdAt: { type: string, format: date-time }
    ReminderTime:
      type: object
      required: [slot, time]
      properties:
        slot: { $ref: '#/components/schemas/TimeSlot' }
        time: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: '07:00' }
    TimeSlot:
      type: string
      enum: [MORNING, NOON, AFTERNOON, EVENING]
    DeviceRole:
      type: string
      enum: [PATIENT, DELEGATE]
    PairingCode:
      type: object
      properties:
        code: { type: string, example: '482913' }
        role: { $ref: '#/components/schemas/DeviceRole' }
        expiresAt: { type: string, format: date-time }
    DevicePairRequest:
      type: object
      required: [code, pushToken, platform]
      properties:
        code: { type: string, pattern: '^\d{6}$' }
        pushToken: { type: string, description: Token FCM hoặc APNs }
        platform: { type: string, enum: [ANDROID, IOS] }
    DeviceToken:
      type: object
      properties:
        deviceToken: { type: string }
        role: { $ref: '#/components/schemas/DeviceRole' }
        patientAlias: { type: string, example: Bố }
    DelegateCreate:
      type: object
      required: [alias, relation]
      properties:
        alias: { type: string, maxLength: 50, example: Mẹ }
        relation: { type: string, maxLength: 50, example: Vợ bệnh nhân }
    Delegate:
      allOf:
        - $ref: '#/components/schemas/DelegateCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
            createdAt: { type: string, format: date-time }
    Drug:
      type: object
      properties:
        id: { type: string, format: uuid }
        brandName: { type: string, example: Glucophage 500mg }
        activeIngredients:
          type: array
          items:
            type: object
            properties:
              name: { type: string, example: metformin }
              strength: { type: string, example: 500 mg }
        dosageForm: { type: string, example: Viên nén bao phim }
        registrationNo: { type: string, description: Số đăng ký lưu hành }
    PrescriptionStatus:
      type: string
      enum: [DRAFT, ACTIVE, EXPIRED, SUPERSEDED, CANCELLED]
    PrescriptionItemInput:
      type: object
      required: [drugNameRaw, unitsPerDose, slots]
      properties:
        drugId:
          type: string
          format: uuid
          nullable: true
          description: Có giá trị khi người dùng chọn từ gợi ý danh mục
        drugNameRaw:
          type: string
          maxLength: 200
          description: Tên thuốc đúng như ghi trên đơn
        unitsPerDose: { type: number, minimum: 0.25, example: 1 }
        unit: { type: string, example: viên }
        slots:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/TimeSlot' }
        instruction: { type: string, maxLength: 200, example: Uống sau ăn }
    PrescriptionInput:
      type: object
      required: [issuedDate, startDate, nextVisitDate, items]
      properties:
        issuedDate: { type: string, format: date }
        startDate: { type: string, format: date }
        nextVisitDate: { type: string, format: date }
        sourceNote:
          type: string
          maxLength: 200
          description: Nguồn tra cứu đơn, ví dụ hệ thống số hóa của bệnh viện
        items:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/PrescriptionItemInput' }
    Prescription:
      allOf:
        - $ref: '#/components/schemas/PrescriptionInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            patientId: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/PrescriptionStatus' }
            confirmedAt: { type: string, format: date-time, nullable: true }
            warnings:
              type: array
              description: Cảnh báo từ Rule Engine, ví dụ trùng hoạt chất
              items: { type: string }
    DoseStatus:
      type: string
      enum: [SCHEDULED, PENDING, TAKEN, TAKEN_BY_DELEGATE, MISSED, LATE_CONFIRMED, CANCELLED]
    Dose:
      type: object
      properties:
        id: { type: string, format: uuid }
        prescriptionItemId: { type: string, format: uuid }
        drugDisplayName: { type: string, example: Glucophage 500mg }
        unitsPerDose: { type: number }
        scheduledAt: { type: string, format: date-time }
        deadlineAt: { type: string, format: date-time }
        status: { $ref: '#/components/schemas/DoseStatus' }
        lastConfirmation:
          allOf:
            - $ref: '#/components/schemas/Confirmation'
          nullable: true
    ConfirmationCreate:
      type: object
      properties:
        takenAt:
          type: string
          format: date-time
          description: Mặc định là thời điểm máy chủ nhận yêu cầu
        correctsConfirmationId:
          type: string
          format: uuid
          nullable: true
          description: Dùng khi đính chính một xác nhận bấm nhầm
    Confirmation:
      type: object
      properties:
        id: { type: string, format: uuid }
        doseId: { type: string, format: uuid }
        actorRole: { $ref: '#/components/schemas/DeviceRole' }
        actorId: { type: string, format: uuid }
        takenAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }
        resultingStatus: { $ref: '#/components/schemas/DoseStatus' }
    AdherenceSummary:
      type: object
      properties:
        fromDate: { type: string, format: date }
        toDate: { type: string, format: date }
        totalDoses: { type: integer }
        taken: { type: integer }
        takenByDelegate: { type: integer }
        lateConfirmed: { type: integer }
        missed: { type: integer }
        adherenceRate:
          type: number
          format: float
          minimum: 0
          maximum: 1
          description: Công thức tính chờ chốt cách xử lý Xác nhận muộn
    Alert:
      type: object
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [DOSE_MISSED, VISIT_UPCOMING, DUPLICATE_INGREDIENT] }
        message: { type: string }
        relatedDoseId: { type: string, format: uuid, nullable: true }
        createdAt: { type: string, format: date-time }
        read: { type: boolean }
    LabTestType:
      type: string
      enum: [FASTING_GLUCOSE, HBA1C, POSTPRANDIAL_GLUCOSE, OTHER]
    LabResultCreate:
      type: object
      required: [testType, value, unit, testedDate]
      properties:
        testType: { $ref: '#/components/schemas/LabTestType' }
        value: { type: number, minimum: 0 }
        unit: { type: string, example: mmol/L }
        testedDate: { type: string, format: date }
        note: { type: string, maxLength: 200 }
    LabResult:
      allOf:
        - $ref: '#/components/schemas/LabResultCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            createdAt: { type: string, format: date-time }
    AppointmentCreate:
      type: object
      required: [visitDate]
      properties:
        visitDate: { type: string, format: date }
        remindDaysBefore: { type: integer, minimum: 0, maximum: 14, default: 2 }
        note: { type: string, maxLength: 200 }
    Appointment:
      allOf:
        - $ref: '#/components/schemas/AppointmentCreate'
        - type: object
          properties:
            id: { type: string, format: uuid }
            status: { type: string, enum: [UPCOMING, DONE, MISSED] }
    ReportJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [QUEUED, PROCESSING, READY, FAILED] }
        periodDays: { type: integer }
        downloadUrl: { type: string, format: uri, nullable: true }
        createdAt: { type: string, format: date-time }
    AuditLog:
      type: object
      description: Cấu trúc bắt buộc theo FR-18
      properties:
        timestamp: { type: string, format: date-time }
        userId: { type: string, format: uuid }
        actionType: { type: string, example: DOSE_CONFIRMED }
        status: { type: string, enum: [SUCCESS, FAILURE] }
        targetType: { type: string, example: Dose }
        targetId: { type: string, format: uuid }
