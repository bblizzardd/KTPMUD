name: Validate and test handoff
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core
      - name: Check syntax, contract, database, scenarios and local application
        shell: bash
        run: |
          set -o pipefail
          mkdir -p test-results
          npm run check 2>&1 | tee test-results/ci-check.txt
      - name: Measure domain coverage
        shell: bash
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee test-results/ci-coverage.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-logs
          path: test-results/*.txt
